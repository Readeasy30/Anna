<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Context Boundary: wholelychit -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmasters LLC | High-Performance Digital Solutions</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 2.5rem; max-width: 600px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); text-align: center; }

        p { color: #9ca3af; line-height: 1.6; }

        .terminal-box { background: #05070f; border: 1px solid #1e293b; padding: 15px; border-radius: 6px; text-align: left; font-family: monospace; font-size: 0.9rem; color: #34d399; margin-top: 20px; overflow-x: auto; }

    <div class="card">

            <div id="runtime-status" style="color: #94a3b8; margin-top: 5px;">Connecting to edge telemetry bindings...</div>
        </div>

        async function fetchAvatarTelemetry() {
            const statusBox = document.getElementById('runtime-status');
            try {
                // Queries the current domain's avatar pipeline path context dynamically
                const response = await fetch('/api/avatar-status');
                if (response.ok) {
                    const data = await response.json();
                    statusBox.innerHTML = Active Persona: <span style="color: #38bdf8;">\</span><br>Status: Running<br>Context: \;
                } else {
                    statusBox.innerText = "System idling. Awaiting deployment parameter keys.";
                }
            } catch (error) {
                statusBox.innerText = "System idling. Awaiting deployment parameter keys.";
            }
        }
        setTimeout(fetchAvatarTelemetry, 1500);
    </script>
</body>
